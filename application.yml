spring:
  application:
    name: nexusfiber-backend

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/core_db
    username: admin
    password: password
    pool:
      max-size: 20
      initial-size: 5

  data:
    redis:
      host: localhost
      port: 6379
      database: 1

server:
  port: 8080

jwt:
  secret: docker-secret-key-change-in-production-docker-secret-key-change-in-production
  expiration: 86400000

logging:
  level:
    root: INFO
    com.nexusfiber: INFO
    org.springframework.r2dbc: WARN
    org.springframework.web.reactive.socket: WARN
